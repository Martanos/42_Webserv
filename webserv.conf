# ==================================================================
# CGI SHOWCASE CONFIGURATION FOR WEBSERV
# ==================================================================

# Configuration for the CGI showcase server running on localhost:3000
# This configuration serves static HTML/PHP files, handles CGI scripts,
# and supports file uploads with proper error handling.

server {
    listen 3002;
    server_name localhost;

    root /home/sean/projects/webserv/www/html;
    index index.php;
    autoindex off;

    client_max_body_size 10M;
    status_page 400 /error/400.html;
    status_page 403 /error/403.html;
    status_page 404 /error/404.html;
    status_page 500 /error/500.html;

    location / {
        allowed_methods GET POST;
    	index index.php index.html;
		cgi_path true;
        root /home/sean/projects/webserv/www/html;
    }
    location /cgi-bin/ {
        allowed_methods GET POST;
        root /home/sean/projects/webserv/www/cgi-bin;
        cgi_path true;

    }
    location /upload {
        allowed_methods GET POST DELETE;

        root /home/sean/projects/webserv/www/html/upload;
        cgi_path true;
        upload_path /home/sean/projects/webserv/www/html/upload;
    }
}
